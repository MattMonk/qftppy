[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "cpp_reference"
version = "0.1.0"
description = "Test-only pybind11 wrappers around the C++ qft++ library, used as a reference for qftppy"
requires-python = ">=3.10"
dependencies = ["numpy"]
