[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qftppy"
version = "0.1.0"
description = "Native PyTorch implementation of the qft++ covariant tensor library"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Monk" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
keywords = ["physics", "amplitude analysis", "covariant tensor", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/MattMonk/qftppy"
Issues = "https://github.com/MattMonk/qftppy/issues"

[tool.hatch.build.targets.sdist]
include = ["src/qftppy", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.10"
pytorch = ">=2.0"

[tool.pixi.pypi-dependencies]
qftppy = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
pre-commit = "*"
python-build = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."
fmt = "ruff check --fix . && ruff format ."
build = "python -m build"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
