name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please manages its autorelease labels via the issues API
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so the
          # release PR gets no CI runs; a fine-grained PAT in this secret fixes that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qftppy/
    permissions:
      contents: read
      id-token: write # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev
          frozen: true
          cache: true
      - run: pixi run test
      - run: pixi run build
      - uses: pypa/gh-action-pypi-publish@release/v1
