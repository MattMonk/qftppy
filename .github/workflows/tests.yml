name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev
          frozen: true # release PRs bump the version without relocking
          cache: true
      - run: pixi run lint
      - run: pixi run test
      - run: pixi run build

  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: cpp
          frozen: true # release PRs bump the version without relocking
          cache: true
      - run: pixi run -e cpp test-cpp
